spring.application.name=risk-score-service
server.port=9092

clients.ml-service=${ML_SERVICE_URL:http://127.0.0.1:8000}
clients.risk-score-service=${RISK_SCORE_SERVICE_URL:http://localhost:9092}
clients.transaction-service=${TRANSACTION_SERVICE_URL:http://localhost:9091}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/risk_score_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.password=1234
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info

spring.datasource.password=${DB_PASSWORD:}
