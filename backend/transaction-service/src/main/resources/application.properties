spring.application.name=transaction-service

clients.risk-score-service=${RISK_SCORE_SERVICE_URL:http://localhost:9092}

# Port where this service will run (http://localhost:9091)
server.port=9091

# JDBC URL for PostgreSQL database (database must already exist)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/transaction-service}

# PostgreSQL database username
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.password=${DB_PASSWORD:}
# PostgreSQL database password
spring.datasource.password=1234


# ===============================
# JPA / HIBERNATE CONFIGURATION
# ===============================

# Automatically create/update database tables based on entity classes
# update = keeps existing data and updates schema if needed
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries executed by Hibernate in the console (for debugging)
spring.jpa.show-sql=true


# ===============================
# ACTUATOR CONFIGURATION
# ===============================

# Expose only health and info endpoints
# Example:
# http://localhost:9091/actuator/health
# http://localhost:9091/actuator/info
management.endpoints.web.exposure.include=health,info

spring.datasource.password=${DB_PASSWORD:}
